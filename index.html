<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>DCT money - V4 穩定版</title>
    
    <link rel="icon" href="https://annie55229900608.github.io/dct-calculator/IMG_2570.JPG" type="image/jpeg">
    <link rel="apple-touch-icon" href="https://annie55229900608.github.io/dct-calculator/IMG_2570.JPG">
    <meta name="apple-mobile-web-app-title" content="DCT money">
    <meta name="apple-mobile-web-app-capable" content="yes">

    <style>
        :root { --primary: #D15598; --secondary: #fce4ec; --text-dark: #333; --bg-color: #f7f8fa; --level-active: linear-gradient(135deg, #D15598 0%, #a64478 100%); }
        * { box-sizing: border-box; font-family: "PingFang TC", "Microsoft JhengHei", sans-serif; letter-spacing: 1px; }
        body { margin: 0; padding: 0; background-color: var(--bg-color); color: var(--text-dark); padding-bottom: 80px; }
        header { background: var(--level-active); color: white; padding: 15px; text-align: center; font-size: 1.2rem; font-weight: bold; position: sticky; top: 0; z-index: 100; }
        .quote-box { background: white; padding: 12px 20px; font-size: 0.85rem; color: var(--primary); text-align: center; border-bottom: 1px solid var(--secondary); font-style: italic; }
        .nav-tabs { display: flex; background: white; border-bottom: 1px solid #ddd; }
        .nav-tab { flex: 1; text-align: center; padding: 12px 0; font-size: 0.9rem; font-weight: bold; color: #666; cursor: pointer; }
        .nav-tab.active { color: var(--primary); border-bottom: 3px solid var(--primary); }
        .container { padding: 15px; display: none; }
        .container.active { display: block; }
        .card { background: #fff; border-radius: 15px; padding: 15px; margin-bottom: 15px; box-shadow: 0 4px 10px rgba(0,0,0,0.05); }
        .level-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 15px; }
        .level-btn { background: white; border: 1px solid #eee; border-radius: 10px; padding: 10px; text-align: center; font-size: 0.85rem; }
        .level-btn.active { background: var(--level-active); color: white; border: none; }
        .buyer-btn-group { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 15px; }
        .buyer-btn { background: white; border: 1px solid #eee; border-radius: 8px; padding: 8px 12px; font-size: 0.8rem; }
        .buyer-btn.active { background: var(--primary); color: white; border: none; }
        .cat-tab { font-size: 0.8rem; padding: 6px 12px; border-radius: 20px; background: #eee; margin-right: 5px; cursor: pointer; display: inline-block;}
        .cat-tab.active { background: var(--primary); color: white; }
        .product-item { display: flex; justify-content: space-between; align-items: center; padding: 10px; border-bottom: 1px solid #f9f9f9; }
        .btn-qty { width: 28px; height: 28px; border-radius: 50%; border: none; background: var(--secondary); color: var(--primary); font-weight: bold; }
        .qty-input { width: 30px; text-align: center; font-weight: bold; }
        .result-card { background: var(--secondary); padding: 15px; border-radius: 15px; text-align: center; margin-top: 10px;}
        .stat-box { background: var(--secondary); padding: 15px; border-radius: 15px; text-align: center; margin-bottom: 15px; }
        .progress-bar { height: 10px; background: #e0e0e0; border-radius: 5px; margin-top: 10px; overflow: hidden; position: relative; }
        .delete-btn { background: #ffcdd2; color: #c62828; border: none; padding: 4px 8px; border-radius: 4px; font-size: 0.7rem; margin-left: 10px;}
    </style>
</head>
<body>

<header>💰 DCT money</header>
<div class="quote-box" id="dailyQuote">每一次成交都是因為妳傳遞了價值。</div>

<div class="nav-tabs">
    <div class="nav-tab active" onclick="switchTab('new-order', this)">➕ 新訂單</div>
    <div class="nav-tab" onclick="switchTab('daily-summary', this)">📅 今日</div>
    <div class="nav-tab" onclick="switchTab('monthly-summary', this)">📊 本月</div>
</div>

<div id="new-order" class="container active">
    <div class="card">
        <div style="font-size:0.9rem; margin-bottom:10px; font-weight:bold;">❶ 你的級別</div>
        <div class="level-grid" id="sellerLevelSelector"></div>
        <div style="font-size:0.9rem; margin-bottom:10px; font-weight:bold;">❷ 銷售對象</div>
        <div class="buyer-btn-group" id="buyerLevelSelector"></div>
    </div>

    <div class="card">
        <div style="margin-bottom:10px;">
            <div class="cat-tab active" onclick="switchCategory('活動', this)">🎁 活動</div>
            <div class="cat-tab" onclick="switchCategory('纖體', this)">纖體</div>
            <div class="cat-tab" onclick="switchCategory('美肌', this)">美肌</div>
            <div class="cat-tab" onclick="switchCategory('保健', this)">保健</div>
        </div>
        <div id="productList"></div>
    </div>

    <input type="text" id="orderNote" style="width:100%; padding:12px; border-radius:10px; border:1px solid #eee; margin-bottom:15px;" placeholder="備註 (IG/姓名)">
    
    <div class="result-card">
        <div style="font-size: 0.8rem; color: #a64478;">預估淨利</div>
        <div id="profitTotal" style="font-size: 1.8rem; font-weight:bold; color:var(--primary);">$0</div>
        <div id="costRevDetail" style="font-size: 0.75rem; color:#666; margin-top:5px;">成本 $0 | 售價 $0</div>
    </div>
    <button onclick="saveOrder()" style="width:100%; padding:15px; background:var(--level-active); color:white; border:none; border-radius:10px; font-weight:bold; margin-top:15px;">儲存訂單</button>
</div>

<div id="daily-summary" class="container">
    <div class="stat-box"><div style="font-size:1.5rem; font-weight:bold; color:var(--primary);" id="dProfit">$0</div><div>今日總淨利</div></div>
    <div class="card">
        <div style="font-size:0.9rem; font-weight:bold; margin-bottom:10px;">📈 今日業績分佈</div>
        <div style="display:flex; justify-content:space-between; font-size:0.8rem;">
            <span id="dRetailText">零售: $0 (0%)</span>
            <span id="dTeamText">團隊: $0 (0%)</span>
        </div>
        <div class="progress-bar">
            <div id="dRetailBar" style="height:100%; background:var(--primary); width:0%; float:left;"></div>
            <div id="dTeamBar" style="height:100%; background:#a64478; width:0%; float:left;"></div>
        </div>
    </div>
    <div id="dailyRecords"></div>
</div>

<div id="monthly-summary" class="container">
    <div class="stat-box"><div style="font-size:1.5rem; font-weight:bold; color:var(--primary);" id="mProfit">$0</div><div>本月累積淨利</div></div>
    <div class="card">
        <div style="font-size:0.9rem; font-weight:bold; margin-bottom:10px;">📊 本月業績分佈</div>
        <div style="display:flex; justify-content:space-between; font-size:0.8rem;">
            <span id="mRetailText">零售總額: $0 (0%)</span>
            <span id="mTeamText">團隊總額: $0 (0%)</span>
        </div>
        <div class="progress-bar">
            <div id="mRetailBar" style="height:100%; background:var(--primary); width:0%; float:left;"></div>
            <div id="mTeamBar" style="height:100%; background:#a64478; width:0%; float:left;"></div>
        </div>
    </div>
    <button onclick="if(confirm('確定歸零？')) {localStorage.clear(); location.reload();}" style="width:100%; padding:10px; background:#ffebee; color:#d32f2f; border:none; border-radius:10px;">🗑️ 清空所有數據</button>
</div>

<script>
    const pricingData = {
        "益生菌 買三送一": { cat: "活動", emoji: "🎁", L2: 2310, L3_sup: 2490, L3_ret: 2580, intern: 2970, vip: 3300, discount: 3300, retail: 3300 },
        "葉黃素凍 買三送一": { cat: "活動", emoji: "🎁", L2: 1230, L3_sup: 1320, L3_ret: 1365, intern: 1590, vip: 1800, discount: 1800, retail: 1800 },
        "纖纖飲X": { cat: "纖體", emoji: "💧", L2: 880, L3_sup: 955, L3_ret: 990, intern: 1160, vip: 1280, discount: 1380, retail: 1480 },
        "纖飄錠": { cat: "纖體", emoji: "💧", L2: 880, L3_sup: 955, L3_ret: 990, intern: 1160, vip: 1280, discount: 1380, retail: 1480 },
        "水光錠": { cat: "美肌", emoji: "✨", L2: 920, L3_sup: 1040, L3_ret: 1080, intern: 1260, vip: 1480, discount: 1580, retail: 1680 },
        "婕肌零": { cat: "美肌", emoji: "✨", L2: 580, L3_sup: 635, L3_ret: 660, intern: 780, vip: 830, discount: 900, retail: 990 },
        "高機能益生菌": { cat: "保健", emoji: "🛡️", L2: 770, L3_sup: 830, L3_ret: 860, intern: 990, vip: 1100, discount: 1180, retail: 1280 },
        "葉黃素晶亮凍": { cat: "保健", emoji: "🛡️", L2: 410, L3_sup: 440, L3_ret: 455, intern: 530, vip: 600, discount: 630, retail: 680 }
    };

    const levels = [{id:"L2", name:"二級輔導", emoji:"🏆"}, {id:"L3_sup", name:"三級輔導", emoji:"🏅"}, {id:"L3_ret", name:"三級零售", emoji:"🛒"}, {id:"intern", name:"實習零售", emoji:"🌱"}];
    const buyers = [
        {id:"retail", name:"單盒零售", type:"retail"}, {id:"vip", name:"VIP價", type:"retail"}, {id:"discount", name:"兩盒優惠", type:"retail"},
        {id:"intern", name:"實習價", type:"team"}, {id:"L3_ret", name:"三級價", type:"team"}, {id:"L3_sup", name:"三級輔導", type:"team"}
    ];

    let currentSeller = "L2", currentBuyer = "retail", currentCat = "活動", cart = {};

    window.onload = () => { 
        renderUI();
        document.getElementById('dailyQuote').innerText = ["每一次成交都是因為妳傳遞了價值。", "溫柔且堅定，讓妳的專業帶領客戶。", "最好的招商力，就是活出妳想要的樣子。"][Math.floor(Math.random()*3)];
    };

    function renderUI() {
        const sDiv = document.getElementById('sellerLevelSelector');
        sDiv.innerHTML = levels.map(l => `<div class="level-btn ${l.id===currentSeller?'active':''}" onclick="currentSeller='${l.id}';renderUI();updateResults();">${l.emoji} ${l.name}</div>`).join('');
        const bDiv = document.getElementById('buyerLevelSelector');
        bDiv.innerHTML = buyers.map(b => `<div class="buyer-btn ${b.id===currentBuyer?'active':''}" onclick="currentBuyer='${b.id}';renderUI();updateResults();">${b.name}</div>`).join('');
        
        const pDiv = document.getElementById('productList');
        pDiv.innerHTML = '';
        for(let name in pricingData) {
            if(pricingData[name].cat !== currentCat) continue;
            let qty = cart[name] || 0;
            pDiv.innerHTML += `<div class="product-item"><span>${pricingData[name].emoji} ${name}<br><small>成本 $${pricingData[name][currentSeller]}</small></span><div style="display:flex;align-items:center;gap:10px;"><button class="btn-qty" onclick="changeQty('${name}',-1)">-</button><b>${qty}</b><button class="btn-qty" onclick="changeQty('${name}',1)">+</button></div></div>`;
        }
        loadDashboards();
    }

    function changeQty(n, d) { cart[n] = Math.max(0, (cart[n]||0)+d); renderUI(); updateResults(); }

    function updateResults() {
        let totalCost=0, totalRev=0;
        for(let n in cart) { totalCost += pricingData[n][currentSeller]*cart[n]; totalRev += pricingData[n][currentBuyer]*cart[n]; }
        document.getElementById('profitTotal').innerText = `$${(totalRev-totalCost).toLocaleString()}`;
        document.getElementById('costRevDetail').innerText = `成本 $${totalCost.toLocaleString()} | 售價 $${totalRev.toLocaleString()}`;
    }

    function saveOrder() {
        let items = [], totalRev=0, totalCost=0;
        for(let n in cart) { if(cart[n]>0) { items.push(`${pricingData[n].emoji}${n}x${cart[n]}`); totalCost+=pricingData[n][currentSeller]*cart[n]; totalRev+=pricingData[n][currentBuyer]*cart[n]; } }
        if(items.length===0) return alert("請先選擇產品數量！");
        
        let type = buyers.find(b => b.id === currentBuyer).type;
        let records = JSON.parse(localStorage.getItem('dct_v4_records')) || [];
        records.push({ id: Date.now(), profit: totalRev-totalCost, totalRev, type: type, note: document.getElementById('orderNote').value, detail: items.join(', ') });
        localStorage.setItem('dct_v4_records', JSON.stringify(records));
        
        cart = {}; document.getElementById('orderNote').value=''; renderUI(); updateResults();
        alert("訂單已儲存！");
    }

    function switchTab(id, el) {
        document.querySelectorAll('.container').forEach(c => c.classList.remove('active'));
        document.querySelectorAll('.nav-tab').forEach(t => t.classList.remove('active'));
        document.getElementById(id).classList.add('active'); el.classList.add('active');
        if(id !== 'new-order') loadDashboards();
    }

    function switchCategory(cat, el) {
        currentCat = cat;
        document.querySelectorAll('.cat-tab').forEach(t => t.classList.remove('active'));
        el.classList.add('active');
        renderUI();
    }

    function loadDashboards() {
        let records = JSON.parse(localStorage.getItem('dct_v4_records')) || [];
        const today = new Date().toDateString();
        let dP=0, dR=0, dT=0, mP=0, mR=0, mT=0, dailyHTML = '';

        records.forEach(r => {
            let rDate = new Date(r.id);
            if(rDate.toDateString() === today) {
                dP += r.profit;
                if(r.type==='retail') dR += r.totalRev; else dT += r.totalRev;
                dailyHTML += `<div style="padding:15px; border-bottom:1px solid #eee; font-size:0.85rem;"><b>${r.note || '無備註'}</b> [${r.type==='retail'?'零售':'團隊'}]<br><small>${r.detail}</small><br><span style="color:var(--primary); font-weight:bold;">淨利 $${r.profit}</span> <button class="delete-btn" onclick="deleteOrder(${r.id})">刪除</button></div>`;
            }
            if(rDate.getMonth() === new Date().getMonth()) {
                mP += r.profit;
                if(r.type==='retail') mR += r.totalRev; else mT += r.totalRev;
            }
        });

        document.getElementById('dProfit').innerText = `$${dP.toLocaleString()}`;
        let dTotal = dR + dT;
        let drP = dTotal > 0 ? Math.round(dR/dTotal*100) : 0;
        let dtP = dTotal > 0 ? Math.round(dT/dTotal*100) : 0;
        document.getElementById('dRetailText').innerText = `零售: $${dR.toLocaleString()} (${drP}%)`;
        document.getElementById('dTeamText').innerText = `團隊: $${dT.toLocaleString()} (${dtP}%)`;
        document.getElementById('dRetailBar').style.width = drP + '%';
        document.getElementById('dTeamBar').style.width = dtP + '%';
        document.getElementById('dailyRecords').innerHTML = dailyHTML || '<div style="text-align:center; padding:20px; color:#999;">今日尚無訂單</div>';

        document.getElementById('mProfit').innerText = `$${mP.toLocaleString()}`;
        let mTotal = mR + mT;
        let mrP = mTotal > 0 ? Math.round(mR/mTotal*100) : 0;
        let mtP = mTotal > 0 ? Math.round(mT/mTotal*100) : 0;
        document.getElementById('mRetailText').innerText = `零售總額: $${mR.toLocaleString()} (${mrP}%)`;
        document.getElementById('mTeamText').innerText = `團隊總額: $${mT.toLocaleString()} (${mtP}%)`;
        document.getElementById('mRetailBar').style.width = mrP + '%';
        document.getElementById('mTeamBar').style.width = mtP + '%';
    }

    function deleteOrder(id) { 
        let rs = JSON.parse(localStorage.getItem('dct_v4_records')); 
        localStorage.setItem('dct_v4_records', JSON.stringify(rs.filter(r=>r.id!==id))); 
        loadDashboards(); 
    }
</script>
</body>
</html>
